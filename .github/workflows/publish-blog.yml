name: Publish scheduled blog posts

on:
  workflow_dispatch:
  schedule:
    # 18:00 Europe/Rome during daylight saving time.
    - cron: "0 16 * * 5"
    # 18:00 Europe/Rome during standard time, plus a fallback run for delayed schedules.
    - cron: "0 17 * * 5"

permissions:
  contents: write

concurrency:
  group: publish-scheduled-blog-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate published blog pages
        run: node tools/generate-blog.mjs --now="$(date --iso-8601=seconds)"
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No scheduled posts to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          git commit -m "Publish scheduled blog posts"
          git push
