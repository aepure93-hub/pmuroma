name: Publish scheduled blog posts

on:
  workflow_dispatch:
  schedule:
    # Avoid minute 00: GitHub may delay or drop scheduled runs during peak load.
    # 18:17 Europe/Rome during daylight saving time.
    - cron: "17 16 * * 5"
    # 18:17 Europe/Rome during standard time; also a DST fallback.
    - cron: "17 17 * * 5"
    # Final fallback if the primary scheduled run is delayed or dropped.
    - cron: "17 18 * * 5"

permissions:
  contents: write

concurrency:
  group: publish-scheduled-blog-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate editorial calendar
        run: node tools/check-blog-schedule.mjs
      - name: Generate published blog pages
        run: node tools/generate-blog.mjs --now="$(date --iso-8601=seconds)"
      - name: Verify generated site
        run: node tools/qa-site.js
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No scheduled posts to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          git commit -m "Publish scheduled blog posts"
          git push
